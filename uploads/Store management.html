  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

px;\n  --b-line-height-200: 20px;\n  --b-line-height-300: 24px;\n  --b-line-height-400: 26px;\n  --b-line-height-500: 28px;\n  --b-line-height-600: 30px;\n  --b-line-height-700: 34px;\n  --b-line-height-800: 44px;\n\n  /* Letter spacing */\n  --b-letter-spacing-000: 0;\n  --b-letter-spacing-100: 0.02em;\n  --b-letter-spacing-200: 0.015em;\n  --b-letter-spacing-300: 0.01em;\n  --b-letter-spacing-400: 0.005em;\n  --b-letter-spacing-600: -0.005em;\n  --b-letter-spacing-700: -0.01em;\n  --b-letter-spacing-800: -0.015em;\n  --b-letter-spacing-900: -0.02em;\n\n  /* ---- Text style aliases (family / size / weight / line-height) ----\n     Note: caption & body (<=14px) use the 'Adyen UI' family for legibility. */\n  --b-text-caption-font-family: 'Adyen UI', var(--b-font-family-primary);\n  --b-text-caption-font-size: var(--b-font-size-100);\n  --b-text-caption-font-weight: var(--b-font-weight-400);\n  --b-text-caption-line-height: var(--b-line-height-100);\n  --b-text-caption-stronger-font-weight: var(--b-font-weight-500);\n\n  --b-text-body-font-family: 'Adyen UI', var(--b-font-family-primary);\n  --b-text-body-font-size: var(--b-font-size-200);\n  --b-text-body-font-weight: var(--b-font-weight-400);\n  --b-text-body-line-height: var(--b-line-height-200);\n  --b-text-body-wide-line-height: var(--b-line-height-300);\n  --b-text-body-stronger-font-weight: var(--b-font-weight-500);\n  --b-text-body-strongest-font-weight: var(--b-font-weight-600);\n\n  --b-text-subtitle-font-family: var(--b-font-family-primary);\n  --b-text-subtitle-font-size: var(--b-font-size-300);\n  --b-text-subtitle-font-weight: var(--b-font-weight-500);\n  --b-text-subtitle-line-height: var(--b-line-height-400);\n\n  --b-text-title-font-family: var(--b-font-family-primary);\n  --b-text-title-font-size: var(--b-font-size-300);\n  --b-text-title-font-weight: var(--b-font-weight-600);\n  --b-text-title-line-height: var(--b-line-height-400);\n\n  --b-text-title-m-font-size: var(--b-font-size-500);\n  --b-tex var(--b-spacer-080);cursor:pointer\">\n                <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px\">\n                  <span style=\"width:18px;height:18px;border-radius:50%;border:2px solid {{ payManualDot }};box-sizing:border-box;display:flex;align-items:center;justify-content:center;flex-shrink:0\"><sc-if value=\"{{ isPayManual }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:8px;height:8px;border-radius:50%;background:var(--b-color-label-primary)\"><\u002Fspan><\u002Fsc-if><\u002Fspan>\n                  <span style=\"font-size:15px;font-weight:600\">Configure manually<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:13.5px;color:var(--b-color-label-secondary)\">Pick each method yourself and see what still needs input.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ isPayCopy }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:block;margin-bottom:var(--b-spacer-080)\">\n              <span style=\"display:block;font-size:13px;font-weight:500;margin-bottom:6px\">Source store<\u002Fspan>\n              <div style=\"position:relative\">\n                <button type=\"button\" sc-camel-on-click=\"{{ toggleSourceMenu }}\" style=\"display:flex;align-items:center;gap:8px;width:100%;height:40px;border:1px solid {{ sourceBorder }};border-radius:var(--b-border-radius-m);padding:0 12px;font-family:var(--b-text-body-font-family);font-size:14px;background:var(--b-color-background-primary);color:var(--b-color-label-primary);box-sizing:border-box;cursor:pointer;text-align:left\"><span style=\"flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ sourceStore }}<\u002Fspan><span style=\"width:16px;height:16px;display:inline-flex;color:var(--b-color-label-tertiary)\"><x-import component-from-global-scope=\"PXDesignSystem_25da7e.Icon\" name=\"chevron-down\" size=\"16px\" hint-size=\"16px,16px\"><\u002Fx-import><\u002Fspan><\u002Fbutton>\n                <sc-if value=\"{{ sourceMenuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"position:absolute;top:44px;left:0;z-index:30;width:100%;max-height:260px;overflow-y:auto;padding:var(--b-spacer-050);background:var(--b-color-background-primary);border:1px solid var(--b-color-separator-primary);border-radius:var(--b-border-radius-l);box-shadow:var(--b-shadow-medium);box-sizing:border-box\">\n                  <sc-for list=\"{{ sourceStoreOptions }}\" as=\"sopt\" hint-placeholder-count=\"3\">\n                  <button class=\"b-menu-item\" type=\"button\" sc-camel-on-click=\"{{ sopt.pick }}\" style=\"display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:0;border-radius:8px;background:none;cursor:pointer;font-family:var(--b-text-body-font-family);font-size:14px;color:var(--b-color-label-primary);text-align:left\">\n                    <span style=\"flex:1\">{{ sopt.label }}<\u002Fspan>\n                    <span style=\"width:14px;height:14px;display:inline-flex;color:{{ sopt.checkColor }}\"><x-import component-from-global-scope=\"PXDesignSystem_25da7e.Icon\" name=\"checkmark\" size=\"14px\" hint-size=\"14px,14px\"><\u002Fx-import><\u002Fspan>\n                  <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"background:var(--b-color-background-primary);overflow:auto\">\n              <div style=\"min-width:620px\">\n                <div class=\"b-dg-head\" style=\"display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--b-color-separator-primary);border-bottom:1px solid var(--b-color-separator-primary);font-size:14px;font-weight:600;color:var(--b-color-label-primary)\">\n                  <div style=\"width:36px\"><\u002Fdiv>\n                  <div style=\"width:190px\">Payment method<\u002Fdiv>\n                  <div style=\"width:140px\">Status<\u002Fdiv>\n                  <div style=\"width:240px\">What this means<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-for list=\"{{ payMethods }}\" as=\"pm\" hint-placeholder-count=\"5\">\n                <div class=\"b-dg-row\" style=\"display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--b-color-separator-primary);font-size:14px\">\n                  <div style=\"width:36px\"><x-import component-from-global-scope=\"PXDesignSystem_25da7e.Checkbox\" checked=\"{{ pm.on }}\" sc-camel-on-change=\"{{ pm.toggle }}\" disabled=\"{{ pm.locked }}\" hint-size=\"20px,20px\"><\u002Fx-import><\u002Fdiv>\n                  <div style=\"width:190px;font-weight:500\">{{ pm.name }}<\u002Fdiv>\n                  <div style=\"width:140px\"><x-import component-from-global-scope=\"PXDesignSystem_25da7e.Tag\" variant=\"{{ pm.variant }}\" hint-size=\"110px,20px\">{{ pm.state }}<\u002Fx-import><\u002Fdiv>\n                  <div style=\"width:240px;font-size:13px;color:var(--b-color-label-secondary)\">{{ pm.reason }}<\u002Fdiv>\n                <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ amexOn }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\";margin-top:var(--b-spacer-080);padding:var(--b-spacer-080);border:1px solid var(--b-color-separator-primary);border-radius:var(--b-border-radius-l);background:var(--b-color-background-secondary)\">\n              <div style=\"font-weight:600;margin-bottom:6px\">American Express needs one more answer<\u002Fdiv>\n              <div style=\"font-size:13.5px;color:var(--b-color-label-secondary);margin-bottom:16px\">This account has no Amex M-level acquirer yet, so tell us which route to take.<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:var(--b-spacer-060)\">\n                <sc-for list=\"{{ amexOptions }}\" as=\"ax\" hint-placeholder-count=\"2\">\n                <div sc-camel-on-click=\"{{ ax.pick }}\" style=\"display:flex;gap:12px;padding:var(--b-spacer-070);border:var(--b-border-width-m) solid {{ ax.border }};border-radius:var(--b-border-radius-l);background:var(--b-color-background-primary);cursor:pointer\">\n                  <span style=\"width:18px;height:18px;margin-top:1px;border-radius:50%;border:2px solid {{ ax.dot }};box-sizing:border-box;display:flex;align-items:center;justify-content:center;flex-shrink:0\"><sc-if value=\"{{ ax.on }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:8px;height:8px;border-radius:50%;background:var(--b-color-label-primary)\"><\u002Fspan><\u002Fsc-if><\u002Fspan>\n                  <div style=\"min-width:0\"><div style=\"font-size:14px;font-weight:600\">{{ ax.title }}<\u002Fdiv><div style=\"font-size:13px;color:var(--b-color-label-secondary);margin-top:3px\">{{ ax.desc }}<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-if value=\"{{ amexMid }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:16px\">\n                <span style=\"display:block;font-size:13px;font-weight:500;margin-bottom:6px\">Your Amex MID<\u002Fspan>\n                <input type=\"text\" value=\"{{ amexMidValue }}\" sc-camel-on-change=\"{{ setAmexMid }}\" placeholder=\"e.g. 3412345678\" style=\"width:100%;height:40px;border:1px solid var(--b-color-outline-secondary);border-radius:var(--b-border-radius-m);padding:0 12px;font-family:var(--b-font-family-secondary);font-size:14px;background:var(--b-color-background-primary)\">\n                <sc-if value=\"{{ amexLevelKnown }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px\"><x-import component-from-global-scope=\"PXDesignSystem_25da7e.Tag\" variant=\"{{ amexLevelVariant }}\" hint-size=\"90px,20px\">{{ amexLevel }}<\u002Fx-import><span style=\"color:var(--b-color-label-secondary)\">{{ amexLevelNote }}<\u002Fspan><\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"margin-top:var(--b-spacer-080)\">\n              <x-import component-from-global-scope=\"PXDesignSystem_25da7e.Button\" variant=\"tertiary\" sc-camel-on-click=\"{{ skipPay }}\" hint-size=\"170px,20px\">Skip for now — finish later<\u002Fx-import>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- SINGLE · store details -->\n          <sc-if value=\"{{ showDetails }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"\">\n            <h2 style=\"margin:0 0 8px;font-family:var(--b-text-title-font-family);font-size:24px;font-weight:600\">Store details<\u002Fh2>\n            <p style=\"margin:0 0 26px;font-size:14px;color:var(--b-color-label-secondary)\">Fields are checked as you go — we tell you the exact rule instead of failing at the end.<\u002Fp>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:var(--b-spacer-070)\">\n              <sc-for list=\"{{ detailFields }}\" as=\"d\" hint-placeholder-count=\"6\">\n              <label style=\"display:block;grid-column:{{ d.span }}\">\n                <span style=\"display:block;font-size:13px;font-weight:500;margin-bottom:6px\">{{ d.label }}<\u002Fspan>\n                <input type=\"text\" value=\"{{ d.value }}\" sc-camel-on-change=\"{{ d.onChange }}\" placeholder=\"{{ d.placeholder }}\" style=\"width:100%;height:40px;border:1px solid {{ d.border }};border-radius:var(--b-border-radius-m);padding:0 12px;font-family:var(--b-text-body-font-family);font-size:14px;background:var(--b-color-background-primary);color:var(--b-color-label-primary)\">\n                <sc-if value=\"{{ d.error }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"display:flex;align-items:flex-start;gap:6px;margin-top:6px;font-size:13px;color:var(--b-color-label-on-background-critical-weak)\"><span style=\"width:14px;height:14px;flex-shrink:0;margin-top:2px;color:var(--b-color-background-critical-strong);display:inline-flex\"><x-import component-from-global-scope=\"PXDesignSystem_25da7e.Icon\" name=\"warning-circle-fill\" size=\"14px\" hint-size=\"14px,14px\"><\u002Fx-import><\u002Fspan><span>{{ d.error }} <a href=\"#\" sc-camel-on-click=\"{{ noop }}\">This looks correct? Request a review<\u002Fa><\u002Fspan><\u002Fspan>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ d.hint }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"display:block;margin-top:6px;font-size:12.5px;color:var(--b-color-label-tertiary)\">{{ d.hint }}<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Flabel>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ showProvince }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:block\">\n              <span style=\"display:block;font-size:13px;font-weight:500;margin-bottom:6px\">Province/State<\u002Fspan>\n              <div style=\"position:relative\">\n                <button type=\"button\" sc-camel-on-click=\"{{ toggleProvinceMenu }}\" style=\"display:flex;align-items:center;gap:8px;width:100%;height:40px;border:1px solid {{ provinceBorder }};border-radius:var(--b-border-radius-m);padding:0 12px;font-family:var(--b-text-body-font-family);font-size:14px;background:var(--b-color-background-primary);color:var(--b-color-label-primary);box-sizing:border-box;cursor:pointer;text-align:left\"><span style=\"flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ province }}<\u002Fspan><span style=\"width:16px;height:16px;display:inline-flex;color:var(--b-color-label-tertiary)\"><x-import component-from-global-scope=\"PXDesignSystem_25da7e.Icon\" name=\"chevron-down\" size=\"16px\" hint-size=\"16px,16px\"><\u002Fx-import><\u002Fspan><\u002Fbutton>\n                <sc-if value=\"{{ provinceMenuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"position:absolute;top:44px;left:0;z-index:30;width:100%;max-height:260px;overflow-y:auto;padding:var(--b-spacer-050);background:var(--b-color-background-primary);border:1px solid var(--b-color-separator-primary);border-radius:var(--b-border-radius-l);box-shadow:var(--b-shadow-medium);box-sizing:border-box\">\n                  <sc-for list=\"{{ provinceOptions }}\" as=\"pv\" hint-placeholder-count=\"4\">\n                  <button class=\"b-menu-item\" type=\"button\" sc-camel-on-click=\"{{ pv.pick }}\" style=\"display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:0;border-radius:8px;background:none;cursor:pointer;font-family:var(--b-text-body-font-family);font-size:14px;color:var(--b-color-label-primary);text-align:left\">\n                    <span style=\"flex:1\">{{ pv.label }}<\u002Fspan>\n                    <span style=\"width:14px;height:14px;display:inline-flex;color:{{ pv.checkColor }}\"><x-import component-from-global-scope=\"PXDesignSystem_25da7e.Icon\" name=\"checkmark\" size=\"14px\" hint-size=\"14px,14px\"><\u002Fx-import><\u002Fspan>\n                  <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;align-items:center;gap:12px;margin:var(--b-spacer-100) 0 var(--b-spacer-070)\">\n              <h3 style=\"margin:0;font-family:var(--b-text-title-font-family);font-size:20px;font-weight:600\">Stores<\u002Fh3>\n              <span style=\"font-size:20px;color:var(--b-color-label-tertiary)\">{{ pendingCount }}<\u002Fspan>\n              <span style=\"margin-left:auto;display:flex;align-items:center;gap:12px\">\n                <x-import component-from-global-scope=\"PXDesignSystem_25da7e.Button\" variant=\"secondary\" sc-camel-on-click=\"{{ noop }}\" hint-size=\"130px,40px\">Upload a CSV<\u002Fx-import>\n                <x-import component-from-global-scope=\"PXDesignSystem_25da7e.Button\" variant=\"secondary\" sc-camel-icon-left=\"plus\" disabled=\"{{ addPendingDisabled }}\" sc-camel-on-click=\"{{ addPendingStore }}\" hint-size=\"120px,40px\">Add store<\u002Fx-import>\n              <\u002Fspan>\n            <\u002Fdiv>\n\n            <div style=\"border:1px solid var(--b-color-separator-primary);border-radius:var(--b-border-radius-l);background:var(--b-color-background-primary)\">\n              <sc-if value=\"{{ pendingEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"padding:var(--b-spacer-090);font-size:14px;color:var(--b-color-label-secondary)\">No stores added yet. Fill in the details above and select Add store — each one is listed here before you create them.<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-for list=\"{{ pendingStores }}\" as=\"p\" hint-placeholder-count=\"0\">\n              <div style=\"display:flex;align-items:flex-start;gap:16px;padding:var(--b-spacer-080) var(--b-spacer-090);border-top:{{ p.rowBorder }}\">\n                <span style=\"width:20px;flex-shrink:0;font-family:var(--b-font-family-secondary);font-size:13px;color:var(--b-color-label-tertiary);line-height:20px\">{{ p.num }}<\u002Fspan>\n                <div style=\"min-width:0;flex:1\">\n                  <div style=\"font-size:14px;font-weight:600\">{{ p.name }}<\u002Fdiv>\n                  <div style=\"font-size:14px;color:var(--b-color-label-secondary);margin-top:2px\">{{ p.address }}<\u002Fdiv>\n                  <div style=\"font-size:14px;color:var(--b-color-label-secondary);margin-top:2px\">{{ p.meta }}<\u002Fdiv>\n                <\u002Fdiv>\n                <x-import component-from-global-scope=\"PXDesignSystem_25da7e.IconButton\" icon=\"bin\" variant=\"secondary\" sc-camel-on-click=\"{{ p.remove }}\" aria-label=\"Remove store\" hint-size=\"36px,36px\"><\u002Fx-import>\n              <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- REVIEW -->\n          <sc-if value=\"{{ showReview }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"\">\n            <h2 style=\"margin:0 0 8px;font-family:var(--b-text-title-font-family);font-size:24px;font-weight:600\">Review and create<\u002Fh2>\n            <p style=\"margin:0 0 26px;font-size:14px;color:var(--b-color-label-secondary)\">{{ reviewLead }}<\u002Fp>\n            <sc-for list=\"{{ reviewGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n            <div style=\"border:1px solid var(--b-color-separator-primary);border-radius:var(--b-border-radius-l);padding:var(--b-spacer-080);margin-bottom:var(--b-spacer-070)\">\n              <div style=\"display:flex;align-items:center;margin-bottom:var(--b-spacer-060)\">\n                <span style=\"font-weight:600\">{{ g.title }}<\u002Fspan>\n                <span style=\"margin-left:auto\"><x-import component-from-global-scope=\"PXDesignSystem_25da7e.Button\" variant=\"tertiary\" condensed=\"\" data-i=\"{{ g.step }}\" sc-camel-on-click=\"{{ goAddStep }}\" hint-size=\"50px,28px\">Edit<\u002Fx-import><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--b-spacer-060)\">\n                <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"2\">\n                <div>\n                  <div style=\"font-size:12.5px;color:var(--b-color-label-tertiary)\">{{ it.label }}<\u002Fdiv>\n                  <div style=\"font-size:14px;margin-top:2px\">{{ it.value }}<\u002Fdiv>\n                <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ pendingAny }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border:1px solid var(--b-color-separator-primary);border-radius:var(--b-border-radius-l);padding:var(--b-spacer-080);margin-bottom:var(--b-spacer-070)\">\n              <div style=\"display:flex;align-items:center;margin-bottom:var(--b-spacer-060)\"><span style=\"font-weight:600\">Stores<\u002Fspan><span style=\"margin-left:8px;color:var(--b-color-label-tertiary)\">{{ pendingCount }}<\u002Fspan><\u002Fdiv>\n              <sc-for list=\"{{ pendingStores }}\" as=\"p\" hint-placeholder-count=\"0\">\n              <div style=\"display:flex;align-items:flex-start;gap:16px;padding:var(--b-spacer-060) 0;border-top:{{ p.rowBorder }}\">\n                <span style=\"width:20px;flex-shrink:0;font-family:var(--b-font-family-secondary);font-size:13px;color:var(--b-color-label-tertiary);line-height:20px\">{{ p.num }}<\u002Fspan>\n                <div style=\"min-width:0;flex:1\">\n                  <div style=\"font-size:14px;font-weight:600\">{{ p.name }}<\u002Fdiv>\n                  <div style=\"font-size:14px;color:var(--b-color-label-secondary);margin-top:2px\">{{ p.address }}<\u002Fdiv>\n                  <div style=\"font-size:14px;color:var(--b-color-label-secondary);margin-top:2px\">{{ p.meta }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex-shrink:0;display:flex;align-items:center;gap:12px;padding:14px 24px;border-top:1px solid var(--b-color-separator-primary)\">\n        <sc-if value=\"{{ addCanBack }}\" hint-placeholder-val=\"{{ false }}\">\n        <x-import component-from-global-scope=\"PXDesignSystem_25da7e.Button\" variant=\"tertiary\" sc-camel-on-click=\"{{ addBack }}\" hint-size=\"80px,40px\">Back<\u002Fx-import>\n        <\u002Fsc-if>\n        <div style=\"margin-left:auto;display:flex;align-items:center;gap:12px\">\n          <x-import component-from-global-scope=\"PXDesignSystem_25da7e.Button\" variant=\"secondary\" sc-camel-on-click=\"{{ closeAdd }}\" hint-size=\"90px,40px\">Cancel<\u002Fx-import>\n          <x-import component-from-global-scope=\"PXDesignSystem_25da7e.Button\" variant=\"primary\" disabled=\"{{ addNextDisabled }}\" sc-camel-on-click=\"{{ addNext }}\" hint-size=\"140px,40px\">{{ addNextLabel }}<\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- created -->\n      <sc-if value=\"{{ addDone }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1;display:flex;align-items:center;justify-content:center;padding:40px\">\n        <div style=\"max-width:520px;text-align:center\">\n          <span style=\"width:64px;height:64px;border-radius:50%;background:var(--b-color-background-success-weak);color:var(--b-color-background-success-strong);display:inline-flex;align-items:center;justify-content:center;margin-bottom:20px\"><x-import component-from-global-scope=\"PXDesignSystem_25da7e.Icon\" name=\"checkmark-circle-fill\" size=\"32px\" hint-size=\"32px,32px\"><\u002Fx-import><\u002Fspan>\n          <h2 style=\"margin:0 0 10px;font-family:var(--b-text-title-font-family);font-size:24px;font-weight:600\">{{ addDoneTitle }}<\u002Fh2>\n          <p style=\"margin:0 0 26px;font-size:14px;color:var(--b-color-label-secondary)\">{{ addDoneBody }}<\u002Fp>\n          <div style=\"display:flex;gap:12px;justify-content:center\">\n            <x-import component-from-global-scope=\"PXDesignSystem_25da7e.Button\" variant=\"secondary\" sc-camel-on-click=\"{{ closeAdd }}\" hint-size=\"130px,40px\">Back to stores<\u002Fx-import>\n            <x-import component-from-global-scope=\"PXDesignSystem_25da7e.Button\" variant=\"primary\" sc-camel-on-click=\"{{ closeAdd }}\" hint-size=\"170px,40px\">Finish payment methods<\u002Fx-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:960}}\">\nconst MERCHANTS = ['AdyenTechSupport_NL','AdyenTechSupport_FR','AtelierEva_ECOM','NordRetail_POS'];\n\nconst COUNTRIES = ['Netherlands','France','Germany','Belgium','United Kingdom','Jersey'];\n\nconst CITY = {\n  Netherlands: ['Amsterdam','Rotterdam','Utrecht','Groningen','Eindhoven'],\n  France: ['Paris','Lyon','Lille','Bordeaux'],\n  Germany: ['Berlin','Hamburg','Munich'],\n  Belgium: ['Antwerp','Brussels'],\n  'United Kingdom': ['London','Manchester'],\n  Jersey: ['Saint Helier'],\n};\n\n// Countries with a province/state concept get a picklist; the rest hide the field.\nconst PROVINCES = {\n  France: ['Auvergne-Rhône-Alpes','Bretagne','Grand Est','Hauts-de-France','Île-de-France','Normandie','Nouvelle-Aquitaine','Occitanie','Provence-Alpes-Côte d\\'Azur'],\n  Germany: ['Baden-Württemberg','Bayern','Berlin','Hamburg','Hessen','Niedersachsen','Nordrhein-Westfalen','Sachsen'],\n  Belgium: ['Antwerpen','Brussels','Limburg','Liège','Namur','Oost-Vlaanderen','West-Vlaanderen'],\n};\n\n// One postal-code rule, used BOTH to validate input and to generate seed data,\n// so shipped stores can never violate the app's own validator (PRD §5.2).\nconst ZIP_RULES = {\n  Netherlands: { re: /^\\d{4}\\s?[A-Za-z]{2}$/, example: '1234 AB', gen: (i) => (1011 + (i % 900)) + ' AB' },\n  France: { re: /^\\d{5}$/, example: '75001', gen: (i) => String(75001 + (i % 900)) },\n  Germany: { re: /^\\d{5}$/, example: '10115', gen: (i) => String(10115 + (i % 900)) },\n  Belgium: { re: /^\\d{4}$/, example: '1000', gen: (i) => String(1000 + (i % 8000)) },\n  'United Kingdom': { re: /^[A-Z]{1,2}\\d[A-Z\\d]?\\s?\\d[A-Z]{2}$/, example: 'W1D 1AN', gen: (i) => 'W' + (1 + (i % 9)) + 'D ' + (1 + (i % 9)) + 'AN' },\n  Jersey: { re: /^JE\\d\\s?\\d[A-Z]{2}$/, example: 'JE1 1AA', gen: (i) => 'JE' + (1 + (i % 5)) + ' ' + (1 + (i % 9)) + 'AA' },\n};\nfunction badZip(value, country) {\n  const rule = ZIP_RULES[country];\n  const v = (value || '').trim();\n  return !!rule && v.length > 0 && !rule.re.test(v);\n}\nfunction zipError(country) {\n  const rule = ZIP_RULES[country];\n  return rule\n    ? 'Postal code \\u00b7 Doesn\\u2019t match the format for ' + country + ' (' + rule.example + ') \\u00b7 Check and re-enter.'\n    : '';\n}\n\nfunction zipFor(country, i) {\n  const rule = ZIP_RULES[country];\n  return rule ? rule.gen(i) : String(1000 + i);\n}\n\n// Streets are keyed by country so an address is never internally contradictory.\nconst STREETS = {\n  Netherlands: ['Prinsengracht','Damrak','Coolsingel','Keizersgracht','Herengracht'],\n  France: ['Rue de Rivoli','Boulevard Haussmann','Rue Sainte-Catherine','Cours Mirabeau'],\n  Germany: ['Hauptstrasse','Kurfürstendamm','Mönckebergstrasse','Maximilianstrasse'],\n  Belgium: ['Meir','Rue Neuve','Korenmarkt','Bondgenotenlaan'],\n  'United Kingdom': ['Oxford Street','Regent Street','Deansgate','King Street'],\n  Jersey: ['Halkett Place','King Street','Broad Street'],\n};\n\nfunction buildStores() {\n  const out = [];\n  const names = ['Flagship','Outlet','Pop-up','Concept','Airport','Central','Station','Mall','Riverside','Old Town'];\n  for (let i = 0; i < 63; i++) {\n    const country = COUNTRIES[i % COUNTRIES.length];\n    const cities = CITY[country];\n    const city = cities[i % cities.length];\n    const roads = STREETS[country];\n    const statusRoll = i % 11;\n    const status = statusRoll === 10 ? 'Closed' : (statusRoll >= 8 ? 'Inactive' : 'Active');\n    const terminals = status === 'Closed' ? 0 : [0, 2, 4, 1, 7, 0, 3, 12, 5, 0][i % 10];\n    // split across the three Bento terminal-status buckets\n    const termOff = terminals === 0 ? 0 : [0, 0, 1, 0, 2, 0, 0, 3, 1, 0][i % 10];\n    const termWeek = terminals - termOff <= 0 ? 0 : [0, 1, 0, 0, 2, 0, 1, 4, 0, 0][i % 10];\n    const termOnline = Math.max(0, terminals - termOff - termWeek);\n    const zip = zipFor(country, i);\n    // seed data must satisfy the validator it ships with\n    if (badZip(zip, country)) throw new Error('seed zip invalid for ' + country + ': ' + zip);\n    out.push({\n      id: 'st' + i,\n      code: 'ST_' + (10420 + i * 7),\n      name: names[i % names.length] + ' ' + city,\n      status,\n      country,\n      city,\n      street: roads[i % roads.length] + ' ' + (12 + (i * 3) % 180),\n      zip,\n      phone: '+31 20 555 ' + (1000 + i),\n      merchant: MERCHANTS[i % MERCHANTS.length],\n      terminals, termOnline, termWeek, termOff,\n      storeId: 'ST' + (32940 + i * 137) + 'D22322BD5PPM' + (6852 + i) + 'ZKW',\n    });\n  }\n  return out;\n}\n\nconst STORES = buildStores();\n\nconst SV = { Active: 'green', Inactive: 'orange', Closed: 'grey' };\nconst TV = { Active: 'green', Inactive: 'grey', 'Inactive with modifications': 'orange', Closed: 'red' };\n\n\n// Countries where Adyen has no POS acquiring yet: the store is created first and\n// payment methods are attached afterwards via Management API (PRD §4.5).\nconst NON_POS = ['Jersey'];\n\n// `countries: null` = available everywhere we do POS. Domestic schemes list their markets.\nconst PAY_METHODS = [\n  { id:'visa', name:'Visa', countries:null },\n  { id:'mc', name:'Mastercard', countries:null },\n  { id:'maestro', name:'Maestro', countries:null },\n  { id:'amex', name:'American Express', countries:null, needsInput:true },\n  { id:'ideal', name:'iDEAL', countries:['Netherlands'] },\n  { id:'bancontact', name:'Bancontact', countries:['Belgium'] },\n  { id:'cartesb', name:'Cartes Bancaires', countries:['France'] },\n  { id:'girocard', name:'girocard', countries:['Germany'] },\n  { id:'alipay', name:'Alipay', countries:null, viaSource:true },\n  { id:'wechat', name:'WeChat Pay', countries:null, viaSource:true },\n];\n\nfunction methodStatus(pm, country, copiedFromStore) {\n  if (NON_POS.indexOf(country) !== -1) {\n    return { state:'Not available here', variant:'grey',\n      reason:'Stores in ' + country + ' are created without payment methods and configured afterwards.' };\n  }\n  if (pm.countries && pm.countries.indexOf(country) === -1) {\n    return { state:'Not available here', variant:'grey',\n      reason:'A domestic scheme for ' + pm.countries.join(', ') + ' — not supported in ' + country + '.' };\n  }\n  if (pm.needsInput) {\n    return { state:'Needs input', variant:'orange',\n      reason:'Needs an Amex MID or Adyen M-level acquiring.' };\n  }\n  return { state:'Available', variant:'green',\n    reason: (pm.viaSource && copiedFromStore)\n      ? 'Live on the source store — copied across.'\n      : 'Configured automatically when the store is created.' };\n}\n\nconst DIAL_BY_COUNTRY = { Netherlands:'+31', France:'+33', Germany:'+49', 'United Kingdom':'+44', Austria:'+43', Spain:'+34', 'United States':'+1', Belgium:'+32', Italy:'+39' };\n\nclass Component extends DCLogic {\n  state = {\n    query: '',\n    statusFilter: {},\n    country: 'All countries',\n    page: 1,\n    pageSize: 20,\n    selected: {},\n    menuRow: null,\n    statusMenuOpen: false,\n    dd: null,\n    pendingStores: [],\n    efStatusMenuOpen: false,\n    countryMenuOpen: false,\n    storeMenuOpen: false,\n    navOpen: true,\n    pageStore: null,\n    devicesStore: null,\n\n    bulkOpen: false, bulkStep: 0, bulkTarget: null, ack: false, typed: '',\n    editId: null, editVals: {},\n    addOpen: false, addStep: 0, addMode: 'Single store', addDone: false,\n    payMode: 'copy', payOff: {}, amexRoute: null, amexMidValue: '',\n    newCountry: 'Netherlands',\n    details: {},\n  };\n\n  componentDidMount() { this._wireGrids(); }\n  componentDidUpdate() { this._wireGrids(); }\n\n  _wireGrids() {\n    if (this._wiring) return;\n    this._wiring = true;\n    // setTimeout, not rAF: rAF is paused in background/hidden tabs, which would\n    // leave the grid unmeasured and without resize grips until the tab is shown.\n    setTimeout(() => {\n      this._wiring = false;\n      document.querySelectorAll('.b-dg-head').forEach(head => {\n        const cells = Array.from(head.children);\n        const container = head.parentElement;\n        const bodyRows = () => Array.from(container.querySelectorAll('.b-dg-row'))\n          .filter(r => r.children.length === cells.length);\n\n        if (!head.dataset.dgMeasured) {\n          const rows0 = bodyRows();\n          const restore = [];\n          const relax = (el) => {\n            restore.push([el, el.style.cssText]);\n            el.style.flex = '0 0 auto';\n            el.style.width = 'auto';\n            el.style.overflow = 'visible';\n            el.style.whiteSpace = 'nowrap';\n          };\n          cells.forEach(relax);\n          rows0.forEach(r => Array.from(r.children).forEach(relax));\n          const natural = cells.map((cell, i) => {\n            let w = Math.ceil(cell.getBoundingClientRect().width);\n            rows0.forEach(r => {\n              const c = r.children[i];\n              if (c) w = Math.max(w, Math.ceil(c.getBoundingClientRect().width));\n            });\n            return w;\n          });\n          restore.forEach(([el, css]) => { el.style.cssText = css; });\n          head.dataset.dgNatural = JSON.stringify(natural);\n          head.dataset.dgMeasured = '1';\n        }\n        const natural = JSON.parse(head.dataset.dgNatural || '[]');\n\n        cells.forEach((cell, i) => {\n          if (!cell.dataset.dgSized) {\n            const rows = bodyRows();\n            const need = (natural[i] || 0) + 16;\n            const w = Math.min(Math.max(need, Math.min(72, need)), 420);\n            if (w > 0) {\n              cell.style.flex = '0 0 auto';\n              cell.style.width = w + 'px';\n              rows.forEach(r => {\n                const c = r.children[i];\n                if (c) { c.style.flex = '0 0 auto'; c.style.width = w + 'px'; }\n              });\n              cell.dataset.dgSized = '1';\n            }\n          }\n          if (i === cells.length - 1 || cell.querySelector(':scope > .b-dg-resizer')) return;\n          const grip = document.createElement('span');\n          grip.className = 'b-dg-resizer';\n          grip.setAttribute('aria-hidden', 'true');\n          cell.appendChild(grip);\n          grip.addEventListener('pointerdown', (e) => {\n            e.preventDefault();\n            e.stopPropagation();\n            const startX = e.clientX;\n            const startW = cell.getBoundingClientRect().width;\n            const rows = bodyRows();\n            grip.setPointerCapture(e.pointerId);\n            head.classList.add('b-dg-resizing');\n            document.body.classList.add('b-dg-dragging');\n            const move = (ev) => {\n              const w = Math.max(32, Math.round(startW + (ev.clientX - startX)));\n              cell.style.width = w + 'px';\n              rows.forEach(r => { const c = r.children[i]; if (c) c.style.width = w + 'px'; });\n            };\n            const up = () => {\n              grip.removeEventListener('pointermove', move);\n              grip.removeEventListener('pointerup', up);\n              head.classList.remove('b-dg-resizing');\n              document.body.classList.remove('b-dg-dragging');\n            };\n            grip.addEventListener('pointermove', move);\n            grip.addEventListener('pointerup', up);\n          });\n        });\n      });\n    });\n  }\n\n  _filtered() {\n    const s = this.state;\n    const q = (s.query || '').trim().toLowerCase();\n    const active = Object.keys(s.statusFilter).filter(k => s.statusFilter[k]);\n    return STORES.filter(st => {\n      if (active.length && active.indexOf(st.status) === -1) return false;\n      if (s.country !== 'All countries' && st.country !== s.country) return false;\n      if (q) {\n        const hay = (st.code + ' ' + st.name + ' ' + st.street + ' ' + st.city).toLowerCase();\n        if (hay.indexOf(q) === -1) return false;\n      }\n      return true;\n    }
